# Production deployment: file-based Traefik routing (router/service/middleware
# live in your Traefik dynamic config). Container only joins the `frontend`
# external network so Traefik can reach http://gh-cli-mcp:8000 internally.
# tmpfs /tmp/repos: ephemeral clone workspace, exec/setuid/dev disabled.
#
# SIZING INVARIANT (do not break this):
#   memory limit >= tmpfs size + node heap headroom + page cache headroom
# tmpfs pages are charged to this container's memory cgroup as `shmem` and are
# not reclaimable under pressure the way page cache is, so every byte of cloned
# repo is a byte of the memory limit. A tmpfs larger than the memory limit is
# not a safety valve -- it just guarantees the OOM killer arrives before the
# clone budget is ever enforced. Current numbers: 512M tmpfs + ~64M node heap
# + ~192M page cache headroom = 768M limit. TMPFS_QUOTA_MB in .env is set below
# the tmpfs size (448 < 512) so the manager evicts before the mount hits ENOSPC.
# init: true -> tini PID 1 reaps stray git/rg/gh children on shutdown.

services:
  gh-cli-mcp:
    build: .
    container_name: gh-cli-mcp
    restart: unless-stopped
    init: true
    env_file:
      - .env
    tmpfs:
      - /tmp/repos:size=512m,mode=1770,noexec,nosuid,nodev
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "--tries=1", "--timeout=2", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 32M
    # Traefik routing lives in /root/dev/traefik/config/hosts.yaml (file-based,
    # hetzner convention). The container only needs to be on the `frontend`
    # network so Traefik can reach http://gh-cli-mcp:8000 internally.

networks:
  frontend:
    external: true
